<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img">
<title>How the yeast model turns declared constraints into conditional flux results</title>
<desc>Glucose and oxygen bounds constrain a balanced reaction network alongside fixed maintenance and other medium assumptions. Biomass assembly r_4041 feeds the biomass drain r_2111. FBA optimizes the drain; FVA calculates selected individual ranges. Arrows are modeling relationships, not individual biochemical reactions.</desc>
<rect width="960" height="750" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#596773"/></marker></defs>
<text x="480" y="36" font-size="26" fill="#203449" font-weight="bold" text-anchor="middle">From model constraints to conditional results</text>
<text x="480" y="66" font-size="17" fill="#596773" font-weight="normal" text-anchor="middle">Bookkeeping schematic — not a reaction-by-reaction pathway map</text>
<rect x="55" y="100" width="360" height="125" rx="12" fill="white" stroke="#386CB0" stroke-width="2"/><text x="235" y="130" font-size="20" fill="#386CB0" font-weight="bold" text-anchor="middle">Exchange bounds</text><text x="235" y="162" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Glucose r_1714; oxygen r_1992</text><text x="235" y="187" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Negative flux denotes uptake</text><text x="235" y="212" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Caps are rates, not concentrations</text>
<rect x="545" y="100" width="360" height="125" rx="12" fill="white" stroke="#B87824" stroke-width="2"/><text x="725" y="130" font-size="20" fill="#B87824" font-weight="bold" text-anchor="middle">Other retained constraints</text><text x="725" y="162" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Deposited medium and bounds</text><text x="725" y="187" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Maintenance r_4046 = 0.7</text><text x="725" y="212" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Model assumptions remain active</text>
<path d="M235,225 L350,270" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M725,225 L610,270" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="270" width="520" height="100" rx="12" fill="white" stroke="#007F7B" stroke-width="2"/><text x="480" y="300" font-size="20" fill="#007F7B" font-weight="bold" text-anchor="middle">Balanced reaction network</text><text x="480" y="332" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">S v = 0; lower ≤ v ≤ upper</text><text x="480" y="357" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Many feasible flux distributions can remain</text>
<path d="M480,370 L480,404" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="405" width="520" height="95" rx="12" fill="white" stroke="#007F7B" stroke-width="2"/><text x="480" y="435" font-size="20" fill="#007F7B" font-weight="bold" text-anchor="middle">Biomass assembly → biomass drain</text><text x="480" y="467" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">r_4041 assembles biomass requirements</text><text x="480" y="492" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">r_2111 is the optimized growth drain</text>
<path d="M360,500 L235,550" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600,500 L725,550" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="55" y="550" width="360" height="125" rx="12" fill="white" stroke="#386CB0" stroke-width="2"/><text x="235" y="580" font-size="20" fill="#386CB0" font-weight="bold" text-anchor="middle">FBA result</text><text x="235" y="612" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Maximum modeled growth</text><text x="235" y="637" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">One optimal flux vector</text><text x="235" y="662" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Numerical feasibility checks</text>
<rect x="545" y="550" width="360" height="125" rx="12" fill="white" stroke="#B87824" stroke-width="2"/><text x="725" y="580" font-size="20" fill="#B87824" font-weight="bold" text-anchor="middle">FVA results</text><text x="725" y="612" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Selected individual minima/maxima</text><text x="725" y="637" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Declared growth floor and slack</text><text x="725" y="662" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Endpoints need not coexist</text>
<text x="480" y="720" font-size="17" fill="#596773" font-weight="normal" text-anchor="middle">Feasible fluxes are model results, not measured rates or confidence intervals.</text>
</g></svg>
